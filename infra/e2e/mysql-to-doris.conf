env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    plugin_output = "raw_orders"
    url = "jdbc:mysql://mysql-e2e:3306/source_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
    driver = "com.mysql.cj.jdbc.Driver"
    username = "etl_reader"
    password = "${MYSQL_SOURCE_PASSWORD}"
    query = "SELECT order_id, customer_name, amount, status, email, created_at FROM orders"
  }
}

transform {
  Sql {
    plugin_input = "raw_orders"
    plugin_output = "clean_orders"
    query = "SELECT order_id, TRIM(customer_name) AS customer_name, amount, status, email, created_at, 'mysql' AS source_system FROM raw_orders WHERE status = 'PAID' AND amount > 0 AND customer_name IS NOT NULL AND TRIM(customer_name) <> ''"
  }
}

sink {
  Doris {
    plugin_input = "clean_orders"
    fenodes = "doris-fe:8030"
    query-port = 9030
    username = "root"
    password = "${DORIS_PASSWORD}"
    database = "analytics"
    table = "clean_orders"
    sink.label-prefix = "flowpilot-orders-e2e"
    sink.enable-2pc = false
    schema_save_mode = "IGNORE"
    data_save_mode = "DROP_DATA"
    doris.config {
      format = "json"
      read_json_by_line = "true"
    }
  }
}
