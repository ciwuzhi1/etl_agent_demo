env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    plugin_output = "raw_orders"
    url = "__MYSQL_JDBC_URL__"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "__MYSQL_USERNAME__"
    password = "__MYSQL_PASSWORD__"
    query = "SELECT order_id, customer_name, amount, status, email, created_at FROM orders"
  }
}

transform {
  Sql {
    plugin_input = "raw_orders"
    plugin_output = "valid_orders"
    query = """SELECT order_id, TRIM(customer_name) AS customer_name,
      amount, status, REGEXP_REPLACE(email, '^[^@]+', '***') AS email,
      created_at, 'mysql' AS source_system
      FROM raw_orders
      WHERE customer_name IS NOT NULL AND TRIM(customer_name) <> ''
        AND amount > 0 AND status IN ('PAID', 'SHIPPED')"""
  }
}

sink {
  Doris {
    plugin_input = "valid_orders"
    fenodes = "__DORIS_FENODES__"
    username = "__DORIS_USERNAME__"
    password = "__DORIS_PASSWORD__"
    database = "analytics"
    table = "clean_orders"
    sink.label-prefix = "harness-l2-mysql"
    sink.enable-2pc = true
    schema_save_mode = "IGNORE"
    data_save_mode = "DROP_DATA"
    doris.config {
      format = "json"
      read_json_by_line = "true"
    }
  }
}
