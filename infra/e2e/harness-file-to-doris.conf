env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  LocalFile {
    path = "/data/e2e-fixtures/file-orders.jsonl"
    file_format_type = "json"
    encoding = "UTF-8"
    plugin_output = "file_orders"
    schema {
      fields {
        order_id = "bigint"
        customer_name = "string"
        amount = "double"
        status = "string"
        email = "string"
        created_at = "string"
      }
    }
  }
}

transform {
  Sql {
    plugin_input = "file_orders"
    plugin_output = "valid_file_orders"
    query = """SELECT order_id, TRIM(customer_name) AS customer_name,
      amount, status, REGEXP_REPLACE(email, '^[^@]+', '***') AS email,
      TO_DATE(created_at, 'yyyy-MM-dd HH:mm:ss') AS created_at,
      'managed_file' AS source_system
      FROM file_orders
      WHERE amount > 0 AND status IN ('PAID', 'SHIPPED')"""
  }
}

sink {
  Doris {
    plugin_input = "valid_file_orders"
    fenodes = "__DORIS_FENODES__"
    username = "__DORIS_USERNAME__"
    password = "__DORIS_PASSWORD__"
    database = "analytics"
    table = "file_clean_orders"
    sink.label-prefix = "harness-l2-file"
    sink.enable-2pc = true
    schema_save_mode = "IGNORE"
    data_save_mode = "DROP_DATA"
    doris.config {
      format = "json"
      read_json_by_line = "true"
    }
  }
}
